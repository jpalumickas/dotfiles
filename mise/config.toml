[tools]
ruby = "4.0"
node = "26"

# AI coding agents.
claude = "latest"
codex = "latest"

# Global CLI tools installed via npm and managed by mise.
# Available on every OS without per-OS package list divergence.
"npm:oxlint" = "latest"
"npm:oxfmt" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
compile = false

[settings.node]
# Run `corepack enable` after Node installs, so pnpm/yarn shims are wired up
# without an extra step. Lets `packageManager` in package.json take effect.
corepack = true
